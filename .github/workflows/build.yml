name: Build Autoskill Hominhtuan95 EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'Autoskill_Hominhtuan95.py'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pyinstaller cryptography
      - name: Check public key and syntax
        shell: pwsh
        run: |
          if (Select-String -Path Autoskill_Hominhtuan95.py -Pattern "^\s*PUBLIC_KEY_HEX\s*=\s*['`"]REPLACE_WITH_PUBLIC_KEY['`"]") { throw 'Chua cau hinh khoa cong khai HWID.' }
      - name: Build EXE
        run: python -m PyInstaller --clean --onefile --console --name Autoskill_Hominhtuan95 Autoskill_Hominhtuan95.py
      - uses: actions/upload-artifact@v4
        with:
          name: Autoskill_Hominhtuan95_EXE
          path: dist/Autoskill_Hominhtuan95.exe
